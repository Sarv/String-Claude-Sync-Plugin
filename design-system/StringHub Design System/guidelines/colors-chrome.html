<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="sw" style="grid-template-columns:repeat(4,1fr)"><div><div class="s" style="background:var(--gradient-header);height:64px"></div><div class="n">header</div><div class="v">--gradient-header</div></div><div><div class="s" style="background:var(--gradient-sidebar);height:64px"></div><div class="n">sidebar panel</div><div class="v">--gradient-sidebar</div></div><div><div class="s" style="background:var(--gradient-button);height:64px"></div><div class="n">custom-primary</div><div class="v">--gradient-button</div></div><div><div class="s" style="background:var(--sidebar-outer-bg);height:64px"></div><div class="n">sidebar outer</div><div class="v">--sidebar-outer-bg</div></div></div></body></html>
