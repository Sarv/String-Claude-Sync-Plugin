<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="sw" style="grid-template-columns:repeat(8,1fr)"><div><div class="s" style="background:var(--chart-1)"></div><div class="n">chart-1</div></div><div><div class="s" style="background:var(--chart-2)"></div><div class="n">chart-2</div></div><div><div class="s" style="background:var(--chart-3)"></div><div class="n">chart-3</div></div><div><div class="s" style="background:var(--chart-4)"></div><div class="n">chart-4</div></div><div><div class="s" style="background:var(--chart-5)"></div><div class="n">chart-5</div></div><div><div class="s" style="background:var(--chart-6)"></div><div class="n">chart-6</div></div><div><div class="s" style="background:var(--chart-7)"></div><div class="n">chart-7</div></div><div><div class="s" style="background:var(--chart-8)"></div><div class="n">chart-8</div></div></div><div class="row" style="margin-top:12px"><span style="display:flex;gap:6px;align-items:center;font-size:12px"><span style="width:14px;height:14px;border-radius:3px;background:var(--chart-good)"></span>--chart-good</span><span style="display:flex;gap:6px;align-items:center;font-size:12px"><span style="width:14px;height:14px;border-radius:3px;background:var(--chart-caution)"></span>--chart-caution</span><span style="display:flex;gap:6px;align-items:center;font-size:12px"><span style="width:14px;height:14px;border-radius:3px;background:var(--chart-bad)"></span>--chart-bad</span></div></body></html>
