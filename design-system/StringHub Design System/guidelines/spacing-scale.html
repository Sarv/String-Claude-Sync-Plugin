<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px scale · sections 16 apart, items in a card 12" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div style="display:grid;gap:5px"><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-1</span><span style="height:10px;width:12px;background:var(--brand);border-radius:2px"></span><span class="v">4px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-2</span><span style="height:10px;width:24px;background:var(--brand);border-radius:2px"></span><span class="v">8px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-3</span><span style="height:10px;width:36px;background:var(--brand);border-radius:2px"></span><span class="v">12px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-4</span><span style="height:10px;width:48px;background:var(--brand);border-radius:2px"></span><span class="v">16px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-5</span><span style="height:10px;width:60px;background:var(--brand);border-radius:2px"></span><span class="v">20px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-6</span><span style="height:10px;width:72px;background:var(--brand);border-radius:2px"></span><span class="v">24px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-7</span><span style="height:10px;width:96px;background:var(--brand);border-radius:2px"></span><span class="v">32px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-8</span><span style="height:10px;width:120px;background:var(--brand);border-radius:2px"></span><span class="v">40px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-9</span><span style="height:10px;width:144px;background:var(--brand);border-radius:2px"></span><span class="v">48px</span></div><div class="row" style="gap:10px"><span class="lab" style="width:90px">--space-10</span><span style="height:10px;width:192px;background:var(--brand);border-radius:2px"></span><span class="v">64px</span></div></div></body></html>
