<!-- @dsCard group="Spacing" viewport="700x150" name="Shadows" subtitle="Flat: cards have none; only menus & dialogs lift" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="row" style="gap:22px;background:var(--bg);margin:-20px;padding:28px 20px"><div style="text-align:center"><div style="width:96px;height:60px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-xs)"></div><div class="v" style="margin-top:8px">--shadow-xs</div></div><div style="text-align:center"><div style="width:96px;height:60px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-sm)"></div><div class="v" style="margin-top:8px">--shadow-sm</div></div><div style="text-align:center"><div style="width:96px;height:60px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-md)"></div><div class="v" style="margin-top:8px">--shadow-md</div></div><div style="text-align:center"><div style="width:96px;height:60px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg)"></div><div class="v" style="margin-top:8px">--shadow-lg</div></div><div style="text-align:center"><div style="width:96px;height:60px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-focus)"></div><div class="v" style="margin-top:8px">--shadow-focus</div></div></div></body></html>
