<!-- @dsCard group="Colors" viewport="700x110" name="Avatar tones" subtitle=".g1–.g6 deep tones · hash the name to pick one" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="row"><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:90px"><span class="avatar avatar-lg g1">A</span><span class="v">.g1 teal</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:90px"><span class="avatar avatar-lg g2">D</span><span class="v">.g2 burgundy</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:90px"><span class="avatar avatar-lg g3">K</span><span class="v">.g3 charcoal green</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:90px"><span class="avatar avatar-lg g4">M</span><span class="v">.g4 maroon</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:90px"><span class="avatar avatar-lg g5">R</span><span class="v">.g5 shadow blue</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:90px"><span class="avatar avatar-lg g6">P</span><span class="v">.g6 purple</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:90px"><span class="avatar avatar-lg tint">PS</span><span class="v">.tint</span></div></div></body></html>
