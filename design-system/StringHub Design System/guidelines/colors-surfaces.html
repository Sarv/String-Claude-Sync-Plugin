<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & borders" subtitle="Semantic aliases — flip automatically in dark mode" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="sw" style="grid-template-columns:repeat(8,1fr)"><div><div class="s" style="background:var(--bg);border:1px solid var(--border)"></div><div class="n">page</div><div class="v">--bg</div></div><div><div class="s" style="background:var(--bg-elevated);border:1px solid var(--border)"></div><div class="n">hover rows</div><div class="v">--bg-elevated</div></div><div><div class="s" style="background:var(--surface);border:1px solid var(--border)"></div><div class="n">cards</div><div class="v">--surface</div></div><div><div class="s" style="background:var(--surface-2);border:1px solid var(--border)"></div><div class="n">subtle fill</div><div class="v">--surface-2</div></div><div><div class="s" style="background:var(--border);border:1px solid var(--border)"></div><div class="n">hairlines</div><div class="v">--border</div></div><div><div class="s" style="background:var(--border-strong);border:1px solid var(--border)"></div><div class="n">hover</div><div class="v">--border-strong</div></div><div><div class="s" style="background:var(--brand-soft);border:1px solid var(--border)"></div><div class="n">tint bg</div><div class="v">--brand-soft</div></div><div><div class="s" style="background:var(--table-head-bg);border:1px solid var(--border)"></div><div class="n">table head</div><div class="v">--table-head-bg</div></div></div></body></html>
