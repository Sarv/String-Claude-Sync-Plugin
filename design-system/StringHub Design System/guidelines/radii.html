<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="row" style="gap:20px"><div style="text-align:center"><div style="width:70px;height:56px;background:var(--brand-soft);border:1px solid var(--color-brand-300);border-radius:var(--r-sm)"></div><div class="n">6px</div><div class="v">--r-sm</div></div><div style="text-align:center"><div style="width:70px;height:56px;background:var(--brand-soft);border:1px solid var(--color-brand-300);border-radius:var(--r-md)"></div><div class="n">8px</div><div class="v">--r-md</div></div><div style="text-align:center"><div style="width:70px;height:56px;background:var(--brand-soft);border:1px solid var(--color-brand-300);border-radius:var(--r-control)"></div><div class="n">10px</div><div class="v">--r-control</div></div><div style="text-align:center"><div style="width:70px;height:56px;background:var(--brand-soft);border:1px solid var(--color-brand-300);border-radius:var(--r-lg)"></div><div class="n">12px</div><div class="v">--r-lg</div></div><div style="text-align:center"><div style="width:70px;height:56px;background:var(--brand-soft);border:1px solid var(--color-brand-300);border-radius:var(--r-xl)"></div><div class="n">16px</div><div class="v">--r-xl</div></div><div style="text-align:center"><div style="width:70px;height:56px;background:var(--brand-soft);border:1px solid var(--color-brand-300);border-radius:var(--r-pill)"></div><div class="n">999px</div><div class="v">--r-pill</div></div></div></body></html>
