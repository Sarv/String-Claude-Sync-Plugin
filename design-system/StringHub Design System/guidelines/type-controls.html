<!-- @dsCard group="Type" viewport="700x170" name="Form & table type" subtitle="13.5px controls · 14/600 labels · 12.5px capitalised table heads" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div style="display:grid;gap:10px">
<div class="row"><span class="lab">--fs-label 14/600</span><span class="label" style="margin:0">Workspace name</span></div>
<div class="row"><span class="lab">--fs-control 13.5</span><input class="input" value="Acme Support" style="max-width:260px"></div>
<div class="row"><span class="lab">--fs-desc 12.5</span><span class="hint">Replies to tickets are sent from this address.</span></div>
<div class="row"><span class="lab">table head 12.5/500</span><span style="font-size:12.5px;font-weight:500;text-transform:capitalize;background:var(--table-head-bg);padding:6px 12px;border-radius:6px;color:var(--ink-2)">Work item type</span></div></div></body></html>
