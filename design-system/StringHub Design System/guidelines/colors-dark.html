<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="dark" style="margin:-20px;padding:20px;background:var(--bg);height:170px;box-sizing:border-box"><div class="sw" style="grid-template-columns:repeat(8,1fr)"><div><div class="s" style="background:var(--bg);border-color:#333"></div><div class="n" style="color:var(--ink)">bg</div><div class="v">--bg</div></div><div><div class="s" style="background:var(--surface);border-color:#333"></div><div class="n" style="color:var(--ink)">surface</div><div class="v">--surface</div></div><div><div class="s" style="background:var(--surface-2);border-color:#333"></div><div class="n" style="color:var(--ink)">surface-2</div><div class="v">--surface-2</div></div><div><div class="s" style="background:var(--border);border-color:#333"></div><div class="n" style="color:var(--ink)">border</div><div class="v">--border</div></div><div><div class="s" style="background:var(--brand);border-color:#333"></div><div class="n" style="color:var(--ink)">brand</div><div class="v">--brand</div></div><div><div class="s" style="background:var(--accent);border-color:#333"></div><div class="n" style="color:var(--ink)">accent</div><div class="v">--accent</div></div><div><div class="s" style="background:var(--ink-2);border-color:#333"></div><div class="n" style="color:var(--ink)">ink-2</div><div class="v">--ink-2</div></div><div><div class="s" style="background:var(--muted);border-color:#333"></div><div class="n" style="color:var(--ink)">muted</div><div class="v">--muted</div></div></div></div></body></html>
