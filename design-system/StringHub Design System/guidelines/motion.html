<!-- @dsCard group="Spacing" viewport="700x110" name="Motion" subtitle="--t-fast 120 · base 180 · slow 280 · --ease-out" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<style>.m{width:80px;height:34px;border-radius:8px;background:var(--brand-soft);border:1px solid var(--color-brand-300);transition:transform var(--t-base) var(--ease-out),background var(--t-base)}.m:hover{transform:translateY(-2px);background:var(--color-brand-100)}</style><div class="row" style="gap:20px"><div style="text-align:center"><div class="m" style="transition-duration:var(--t-fast)"></div><div class="v" style="margin-top:6px">--t-fast</div></div><div style="text-align:center"><div class="m" style="transition-duration:var(--t-base)"></div><div class="v" style="margin-top:6px">--t-base</div></div><div style="text-align:center"><div class="m" style="transition-duration:var(--t-slow)"></div><div class="v" style="margin-top:6px">--t-slow</div></div><span class="hint">Hover a tile. Reduced-motion zeroes all durations.</span></div></body></html>
