<!-- @dsCard group="Colors" viewport="700x170" name="Semantic" subtitle="50 = tint bg · 500 = solid · 700 = text on tint" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.sw{display:grid;gap:8px}.s{border-radius:8px;height:56px;border:1px solid rgba(0,0,0,.06)}.n{font-size:11px;font-weight:600;margin-top:6px}.v{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted);font-family:var(--font-mono);width:150px;flex-shrink:0}</style></head><body>
<div class="sw" style="grid-template-columns:repeat(4,1fr);gap:14px"><div><div style="display:flex;border-radius:8px;overflow:hidden;height:56px"><div style="flex:1;background:var(--color-success-50)"></div><div style="flex:1;background:var(--color-success-500)"></div><div style="flex:1;background:var(--color-success-700)"></div></div><div class="n">success</div><div class="v">#E6F4EA · #2E7D32 · #1B5E20</div><div style="margin-top:8px;display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--color-success-50);color:var(--color-success-700)">Success text</div></div><div><div style="display:flex;border-radius:8px;overflow:hidden;height:56px"><div style="flex:1;background:var(--color-danger-50)"></div><div style="flex:1;background:var(--color-danger-500)"></div><div style="flex:1;background:var(--color-danger-700)"></div></div><div class="n">danger</div><div class="v">#FCE8E6 · #D32F2F · #B71C1C</div><div style="margin-top:8px;display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--color-danger-50);color:var(--color-danger-700)">Danger text</div></div><div><div style="display:flex;border-radius:8px;overflow:hidden;height:56px"><div style="flex:1;background:var(--color-warning-50)"></div><div style="flex:1;background:var(--color-warning-500)"></div><div style="flex:1;background:var(--color-warning-700)"></div></div><div class="n">warning</div><div class="v">#FFF3E0 · #ED6C02 · #B45309</div><div style="margin-top:8px;display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--color-warning-50);color:var(--color-warning-700)">Warning text</div></div><div><div style="display:flex;border-radius:8px;overflow:hidden;height:56px"><div style="flex:1;background:var(--color-info-50)"></div><div style="flex:1;background:var(--color-info-500)"></div><div style="flex:1;background:var(--color-info-700)"></div></div><div class="n">info</div><div class="v">#E1F5FE · #0288D1 · #01579B</div><div style="margin-top:8px;display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--color-info-50);color:var(--color-info-700)">Info text</div></div></div></body></html>
