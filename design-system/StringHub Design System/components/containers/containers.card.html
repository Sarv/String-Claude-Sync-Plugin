<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel">
const { Card, StatCard, StatMini, EntityCard, KeyValue, Accordion, DataTable, CellMain, Pagination, Status, TaskPill, Badge, Button } = window.StringHubDesignSystem_90e1d8;
function App() {
const rows = [{id:1,name:"Aarav Mehta",email:"aarav@acme.io",type:"Customer",st:"active",p:"high"},{id:2,name:"Diya Sharma",email:"diya@northwind.in",type:"Lead",st:"paused",p:"medium"}];
return <div className="stack">
  <div className="grid-4"><StatCard label="Open tickets" value="342" delta="-8%" deltaDir="down" sub="vs last week" /><StatCard label="First response" value="14m" delta="-3m" sub="median" /><StatCard label="Resolved" value="1,208" delta="+11%" sub="this week" /><StatCard label="CSAT" value="94%" delta="0%" deltaDir="flat" sub="312 ratings" /></div>
  <DataTable columns={[{key:"name",label:"Name",render:r=><CellMain name={r.name} sub={r.email} />},{key:"type",label:"Type",render:r=><Badge>{r.type}</Badge>},{key:"st",label:"Status",render:r=><Status tone={r.st}>{r.st==="active"?"Active":"Paused"}</Status>},{key:"p",label:"Priority",render:r=><TaskPill kind="priority" value={r.p} />}]} rows={rows} footer={<Pagination from={1} to={2} total="2,481" page={1} pages={3} />} />

</div>;
}
