<!-- @dsCard group="Components" viewport="700x400" name="Charts & dashboard" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--bg)}.lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}.box{transform:translateZ(0);position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--border)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { DashCard, Heatmap, Sankey, LegendDot, RatioCell, ChartTip } = window.StringHubDesignSystem_90e1d8;
function App() {
const data = [0,1,2,3,4,5,6].map(d => Array.from({length:24},(_,h)=>Math.round((d<5?46:18)*Math.exp(-Math.pow((h-13)/3.2,2)))));
return <div className="stack">
  <div className="grid-2" style={{alignItems:"start"}}>
    <DashCard title="Coverage" info="How this is calculated" sub="Weekday × hour, Asia/Kolkata"><Heatmap data={data} /></DashCard>
    <div className="stack-2"><DashCard title="Workload right now" live info="Live" state="loading" /><DashCard title="SLA breaches" state="error" />
      <div className="row"><LegendDot color="var(--chart-1)">Opened</LegendDot><LegendDot color="var(--chart-2)">Resolved</LegendDot><ChartTip>Mon 09:00<br/><strong>31</strong> actions</ChartTip></div>
      <div style={{width:160}}><RatioCell value={82.5} n={120} /></div></div>
  </div>
  <DashCard title="State flow" sub="How tickets moved between states this month"><Sankey height={180} nodes={[{id:"Open",label:"Open",col:0,value:140},{id:"In progress",label:"In progress",col:1,value:95},{id:"Waiting",label:"Waiting on customer",col:1,value:45},{id:"Resolved",label:"Resolved",col:2,value:110},{id:"Reopened",label:"Reopened",col:2,value:15},{id:"Closed",label:"Closed",col:2,value:15}]} links={[{from:"Open",to:"In progress",value:95},{from:"Open",to:"Waiting",value:45},{from:"In progress",to:"Resolved",value:80},{from:"In progress",to:"Reopened",value:15},{from:"Waiting",to:"Resolved",value:30},{from:"Waiting",to:"Closed",value:15}]} /></DashCard>
</div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
