<!-- @dsCard group="StringHub dashboard" viewport="1280x800" name="Dashboard UI kit" subtitle="Sign in → dashboard, tickets, projects, contacts, settings" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StringHub — UI kit</title>
<link rel="icon" href="../../assets/stringhub-mark.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>body{margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="ContactsScreen.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="TicketScreen.jsx"></script>
<script type="text/babel" src="BoardScreen.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel" src="SignInScreen.jsx"></script>
<script type="text/babel">
const { AppShell, Topbar, Toast, SearchTrigger, SearchDialog } = window.StringHubDesignSystem_90e1d8;
function App() {
  const [screen, setScreen] = React.useState(localStorage.getItem("sh-kit-screen") || "dashboard");
  const [collapsed, setCollapsed] = React.useState(false);
  const [dark, setDark] = React.useState(false);
  const [toasts, setToasts] = React.useState([]);
  const [search, setSearch] = React.useState(false);
  React.useEffect(() => { localStorage.setItem("sh-kit-screen", screen); }, [screen]);
  React.useEffect(() => { document.documentElement.setAttribute("data-theme", dark ? "dark" : "light"); }, [dark]);
  React.useEffect(() => { const k = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); setSearch(true); } }; document.addEventListener("keydown", k); return () => document.removeEventListener("keydown", k); }, []);
  const toast = (t) => { const id = Date.now(); setToasts((a) => [...a, { id, tone: "success", ...t }]); setTimeout(() => setToasts((a) => a.filter((x) => x.id !== id)), 4000); };
  if (screen === "signin") return <SignInScreen onSignIn={() => setScreen("dashboard")} />;
  const S = { dashboard: DashboardScreen, tickets: TicketScreen, board: BoardScreen, contacts: ContactsScreen, settings: SettingsScreen }[screen] || DashboardScreen;
  return <>
    <AppShell nav={window.SH_DATA.nav} active={screen} onNavigate={setScreen} collapsed={collapsed} logoSrc="../../assets/stringhub-mark.svg" page={screen !== "settings"}
      topbar={<Topbar onToggleSidebar={() => setCollapsed(!collapsed)} onToggleTheme={() => setDark(!dark)} search={<SearchTrigger placeholder="Search tickets, contacts…" onClick={() => setSearch(true)} />}>
        <button className="btn btn-ghost btn-sm" onClick={() => setScreen("signin")}>Sign out</button></Topbar>}>
      <S toast={toast} />
    </AppShell>
    <SearchDialog open={search} onClose={() => setSearch(false)} onSelect={(r) => { setSearch(false); setScreen(r.go); }}
      results={[{ icon: "support", title: "Refund not received for order 88213", sub: "I returned my order last week but the refund still hasn’t arrived.", key: "SUPP-4821", meta: "Customer Support · 2 h ago", go: "tickets" },
        { icon: "user", title: "Diya Sharma", sub: "diya@northwind.in · Northwind Traders", key: "Contact", meta: "14 tickets", go: "contacts" },
        { icon: "task", title: "Refund webhook fires twice on retries", sub: "Orbit dashboard", key: "ORB-131", meta: "In progress", go: "board" },
        { icon: "cog", title: "Desk settings", sub: "Customer Support · General", key: "Settings", go: "settings" }]} />
    <div className="toast-stack" aria-live="polite">{toasts.map((t) => <Toast key={t.id} {...t} onDismiss={() => setToasts((a) => a.filter((x) => x.id !== t.id))} />)}</div>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
