# Shared server: no transcripts mount, hooks push the lines, every device needs approval.
#   ENROLL_TOKENS=acme:<long random> ADMIN_TOKEN=<long random> \
#     docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
# Put it behind HTTPS (a reverse proxy) before exposing it beyond this machine.
services:
  app:
    environment:
      - LOCAL_MODE=false
      - ALLOW_NO_AUTH=false
    volumes: !reset []
  worker:
    environment:
      - LOCAL_MODE=false
      - ALLOW_NO_AUTH=false
    volumes: !reset []
